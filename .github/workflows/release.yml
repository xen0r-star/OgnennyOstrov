name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- JOB 1: Package Code::Blocks project for the teacher ---
  package-codeblocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Code::Blocks project file (.cbp)
        run: python tools/gen_cbp.py

      - name: Create ZIP archive for Code::Blocks
        run: |
          zip -r OgnennyOstrov-CodeBlocks.zip OgnennyOstrov.cbp src deps assets docs README* LICENSE* -x "*.git*" "*.github*" "build/*" "obj/*" "bin/*" || true

      - name: Store artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-cbp
          path: OgnennyOstrov-CodeBlocks.zip

  # --- JOB 2: Build Linux Client & Server independently ---
  build-game-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (SFML, CMake, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsfml-dev

      - name: Configure CMake (Linux)
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build and Package Client (Linux)
        run: |
          cd build
          cmake --build . --target GoulagClient --config Release && {
            mkdir -p ../dist-client
            cp GoulagClient ../dist-client/ 2>/dev/null || cp bin/GoulagClient ../dist-client/ 2>/dev/null || true
            if [ -d "../assets" ]; then cp -r ../assets ../dist-client/; fi
            if [ -d "../docs" ]; then cp -r ../docs ../dist-client/; fi
            cp ../README* ../LICENSE* ../dist-client/ 2>/dev/null || true
            cd ../dist-client && zip -r ../OgnennyOstrov-Client-Linux.zip *
          } || echo "Client build failed"

      - name: Build and Package Server (Linux)
        run: |
          cd build
          cmake --build . --target GoulagServer --config Release && {
            mkdir -p ../dist-server
            cp GoulagServer ../dist-server/ 2>/dev/null || cp bin/GoulagServer ../dist-server/ 2>/dev/null || true
            if [ -d "../docs" ]; then cp -r ../docs ../dist-client/; fi
            cp ../README* ../LICENSE* ../dist-server/ 2>/dev/null || true
            cd ../dist-server && zip -r ../OgnennyOstrov-Server-Linux.zip *
          } || echo "Server build failed (non-blocking)"

      - name: Store Linux Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-client-linux
          path: OgnennyOstrov-Client-Linux.zip

      - name: Store Linux Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-server-linux
          path: OgnennyOstrov-Server-Linux.zip

  # --- JOB 3: Build Windows Client & Server independently (MSYS2 MinGW) ---
  build-game-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake make

      - name: Configure CMake (Windows)
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release ..

      - name: Build and Package Client (Windows)
        shell: msys2 {0}
        run: |
          cd build
          cmake --build . --target GoulagClient --config Release || true

          mkdir -p ../dist-client
          find . -name "GoulagClient.exe" -exec cp {} ../dist-client/ \;

          if [ -d "../deps/SFML/bin" ]; then cp ../deps/SFML/bin/*.dll ../dist-client/ 2>/dev/null || true; fi
          if [ -d "../assets" ]; then cp -r ../assets ../dist-client/; fi
          if [ -d "../docs" ]; then cp -r ../docs ../dist-client/; fi
          cp ../README* ../LICENSE* ../dist-client/ 2>/dev/null || true

      - name: Create Client ZIP (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-client\*" -DestinationPath "OgnennyOstrov-Client-Windows.zip" -Force

      - name: Build and Package Server (Windows)
        shell: msys2 {0}
        run: |
          cd build
          cmake --build . --target GoulagServer --config Release || true

          mkdir -p ../dist-server
          find . -name "GoulagServer.exe" -exec cp {} ../dist-server/ \;

          if [ -f "../deps/SFML/bin/sfml-system-2.dll" ]; then cp ../deps/SFML/bin/sfml-system-2.dll ../dist-server/ 2>/dev/null || true; fi
          if [ -f "../deps/SFML/bin/sfml-network-2.dll" ]; then cp ../deps/SFML/bin/sfml-network-2.dll ../dist-server/ 2>/dev/null || true; fi
          if [ -d "../docs" ]; then cp -r ../docs ../dist-server/; fi
          cp ../README* ../LICENSE* ../dist-server/ 2>/dev/null || true

      - name: Create Server ZIP (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-server\*" -DestinationPath "OgnennyOstrov-Server-Windows.zip" -Force

      - name: Store Windows Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-client-windows
          path: OgnennyOstrov-Client-Windows.zip

      - name: Store Windows Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-server-windows
          path: OgnennyOstrov-Server-Windows.zip

  # --- JOB 4: Create GitHub Release and attach all available files ---
  publish-release:
    needs: [package-codeblocks, build-game-linux, build-game-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Code::Blocks ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-asset-cbp

      - name: Download Linux Client ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-asset-client-linux

      - name: Download Linux Server ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-asset-server-linux

      - name: Download Windows Client ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-asset-client-windows

      - name: Download Windows Server ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-asset-server-windows

      - name: Create GitHub Release and attach files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OgnennyOstrov-CodeBlocks.zip
            OgnennyOstrov-Client-Linux.zip
            OgnennyOstrov-Server-Linux.zip
            OgnennyOstrov-Client-Windows.zip
            OgnennyOstrov-Server-Windows.zip
          generate_release_notes: true
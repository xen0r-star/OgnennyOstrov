name: Package Code::Blocks Project

on:
  push:
    tags:
      - 'v*' # Se déclenche automatiquement quand tu crées un tag (ex: v1.0)
  workflow_dispatch: # Permet aussi de le lancer manuellement depuis l'onglet "Actions" de GitHub

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Code::Blocks project file (.cbp)
        run: python tools/gen_cbp.py

      - name: Create ZIP archive for instructor
        run: |
          zip -r OgnennyOstrov-CodeBlocks.zip OgnennyOstrov.cbp src deps assets -x "*.git*" "*.github*" "build/*" "obj/*" "bin/*" || true

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OgnennyOstrov-CodeBlocks
          path: OgnennyOstrov-CodeBlocks.zip

      - name: Create GitHub Release and attach ZIP (on tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OgnennyOstrov-CodeBlocks.zip
          generate_release_notes: true